<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EITERNALS - Innovation Beyond Limits</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            max-width: 650px;
            padding: 40px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 3px;
            margin: 0 0 15px 0;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.15rem;
            color: #8b949e;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }
        .status {
            font-size: 0.95rem;
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tag">FUTURE TECH ECOSYSTEM</div>
        <h1>EITERNALS</h1>
        <p>আমরা তৈরি করছি পরবর্তী প্রজন্মের সফটওয়্যার ও উদ্ভাবনী প্রযুক্তি। নতুন অভিজ্ঞতার জন্য সাথে থাকুন।</p>
        <div class="status">● Platform Under Active Development</div>
    </div>
</body>
</html>
